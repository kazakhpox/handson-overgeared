name: Release

# Pushing a tag such as v0.1.0 builds the mod and publishes a GitHub release with the jar.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar \
            --title "Hands-On Overgeared ${GITHUB_REF_NAME#v} (NeoForge 1.21.1)" \
            --notes-file .github/release-notes.md
